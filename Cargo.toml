[package]
name = "screenlet"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
mdns-sd = "0.21"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Devices_Display", "Win32_Devices_Enumeration_Pnp", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Console", "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
panic = "abort"
